<!--Créez un formulaire où vous ajoutez: nom, prénom, numéro de téléphone, adresse e-mail, date de naissance, bouton «Envoyer», champs de saisie-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <label for="prenom">prenom</label>
        <input type="text"prenom=prenom id="prenom"><br><br>

        <label for="nom">nom</label>
        <input type="text"nom=nom id="nom"><br><br>

        <label for="telephon">telephon</label>
        <input type="text"telephon=telephon id="telephon"><br><br>

        <label for="adresse e-mail">adresse e-mail</label>
        <input type="text"adresse e-mail=adresse e-mail id="adresse e-mail"><br><br>

        <label for="naissance">naissance</label>
        <input type="date" name="naissance" id="naissance"><br><br>

        <input type="button" value="Envoyer">
        <button type="submit">register</button>
    </form>
</body>
</html>
