<!--Créez un formulaire d'inscription dans lequel vous ajouterez : nom, prénom, email, mot de passe, utilisez un menu déroulant pour que l'utilisateur choisisse s'il est une femme ou un homme, et enfin un bouton submit-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label for="prenom">prenom</label>
    <input type="text" prenom=" prenom" id="prenom"><br><br>

    <label for="nom">nom</label>
    <input type="text"nom=nom id="nom"><br><br>

    <label for="email">email</label>
    <input type="text"email= email id="email"><br><br>

    <label for="mot de passe ">mot de passe</label>
    <input type="text"mot de passe=" mot de passe"><br><br>

    <label for="sexe">sexe</label>
    <select name="sexe" id="sexe">
    <option value="homme">homme</option>
    <option value="femme">femme</option>
    </select>

    <input type="button" value="submit">
</body>
</html>
